    <rect x="300" y="149" width="26" height="20" rx="3" opacity="0.9"/><rect x="332" y="149" width="26" height="20" rx="3" opacity="0.35"/><rect x="364" y="149" width="26" height="20" rx="3" opacity="0.9"/><rect x="396" y="149" width="26" height="20" rx="3" opacity="0.55"/>
    <rect x="300" y="176" width="26" height="20" rx="3" opacity="0.35"/><rect x="332" y="176" width="26" height="20" rx="3" opacity="0.9"/><rect x="364" y="176" width="26" height="20" rx="3" opacity="0.55"/><rect x="396" y="176" width="26" height="20" rx="3" opacity="0.9"/>
