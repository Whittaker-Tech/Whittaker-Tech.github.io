      <stop offset="0" stop-color="#1b2a38"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
  </defs>
  <rect width="440" height="360" fill="url(#bg)"/>
  <!-- Source systems on the left -->
  <g font-family="Poppins, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#d6d6d6">
    <rect x="28" y="62" width="112" height="34" rx="8" fill="#2b2b2c" stroke="#38bdf8" stroke-opacity="0.35"/>
