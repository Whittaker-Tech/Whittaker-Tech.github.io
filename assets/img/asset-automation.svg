  <path d="M220 170 a13 13 0 0 1 23 -5 M244 180 a13 13 0 0 1 -23 5" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M243 157 l1 9 -9 -1 M221 193 l-1 -9 9 1" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 175 L 292 175" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
